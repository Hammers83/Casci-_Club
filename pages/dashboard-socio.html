<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASCIA' CLUB | Area Socio</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { azzurro: '#1EA7E1', azzurroDark: '#0C7FB0', dark: '#0A0A0C', card: '#151519', border: '#26262E' }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-brand-dark text-gray-100 font-sans min-h-screen flex flex-col antialiased">

    <!-- NAVBAR -->
    <nav class="sticky top-0 z-40 glass-panel border-b border-brand-border">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="../assets/img/logo-cascia.png" alt="Logo Cascià Club" class="w-10 h-10 rounded-xl object-contain bg-white p-0.5">
                <span class="text-xl font-black uppercase text-white">CASCIA' <span class="brand-text-gradient">CLUB</span></span>
            </div>

            <div class="flex items-center space-x-4">
                <div class="relative">
                    <button id="btn-notifications" class="relative p-2.5 bg-brand-dark border border-brand-border rounded-xl text-gray-300 hover:text-white transition focus:outline-none">
                        <i class="fa-solid fa-bell text-lg"></i>
                        <span id="notif-badge" class="hidden absolute -top-1 -right-1 bg-brand-azzurro text-black text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-brand-dark">0</span>
                    </button>

                    <div id="notif-dropdown" class="hidden absolute right-0 mt-2 w-80 sm:w-96 bg-brand-dark border border-brand-border rounded-2xl shadow-2xl z-50 p-4 space-y-3">
                        <div class="flex justify-between items-center border-b border-brand-border pb-2">
                            <h4 class="text-xs font-black uppercase text-white tracking-wider">
                                <i class="fa-solid fa-bell text-brand-azzurro mr-1"></i> Notifiche
                            </h4>
                            <button onclick="markAllNotificationsAsRead()" class="text-[10px] font-bold text-brand-azzurro hover:underline">
                                Segna tutte come lette
                            </button>
                        </div>
                        <div id="notif-list-container" class="max-h-64 overflow-y-auto space-y-2 pr-1">
                            <p class="text-xs text-gray-500 text-center py-4">Caricamento notifiche...</p>
                        </div>
                    </div>
                </div>

                <div id="nav-links" class="flex items-center space-x-3"></div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 space-y-6">

        <!-- INTESTAZIONE + LA MIA AUTO -->
        <div class="glass-panel p-6 rounded-3xl flex flex-col lg:flex-row gap-6 border-l-4 border-l-brand-azzurro">
            <div class="flex items-center space-x-4 flex-1">
                <img id="member-avatar-img" src="https://via.placeholder.com/80" alt="Avatar" class="w-20 h-20 rounded-2xl object-cover border-2 border-brand-azzurro">
                <div>
                    <h2 id="member-welcome" class="text-2xl font-black text-white"></h2>
                    <p class="text-xs text-gray-400 mt-1">Socio CASCIA' CLUB</p>
                </div>
            </div>

            <div class="flex-1 bg-brand-dark/60 border border-brand-border rounded-2xl p-4 flex gap-4 items-center">
                <img id="car-photo-preview" src="" alt="Foto auto" class="hidden w-24 h-24 rounded-xl object-cover border border-brand-border">
                <div id="car-photo-placeholder" class="w-24 h-24 rounded-xl border border-dashed border-brand-border flex items-center justify-center text-gray-500">
                    <i class="fa-solid fa-car-side text-2xl"></i>
                </div>
                <div class="flex-grow">
                    <p class="text-[11px] font-black text-brand-azzurro uppercase mb-1">La mia auto</p>
                    <p id="car-data-text" class="text-sm font-bold text-white">Nessun dato inserito</p>
                </div>
            </div>
        </div>

        <!-- FORM AGGIORNA AUTO -->
        <div class="glass-panel p-6 rounded-3xl space-y-4">
            <h3 class="text-lg font-black uppercase text-white flex items-center gap-2">
                <i class="fa-solid fa-car text-brand-azzurro"></i> Aggiorna Dati e Foto Auto
            </h3>
            <form id="form-update-car" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Marca</label>
                    <input type="text" id="car-brand-input" class="w-full px-4 py-2.5 bg-brand-dark border border-brand-border rounded-xl text-white text-xs focus:outline-none focus:border-brand-azzurro">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Modello</label>
                    <input type="text" id="car-model-input" class="w-full px-4 py-2.5 bg-brand-dark border border-brand-border rounded-xl text-white text-xs focus:outline-none focus:border-brand-azzurro">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Anno</label>
                    <input type="number" id="car-year-input" min="1900" max="2100" class="w-full px-4 py-2.5 bg-brand-dark border border-brand-border rounded-xl text-white text-xs focus:outline-none focus:border-brand-azzurro">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Categoria</label>
                    <select id="car-category-input" class="w-full px-4 py-2.5 bg-brand-dark border border-brand-border rounded-xl text-white text-xs focus:outline-none focus:border-brand-azzurro">
                        <option value="fuoristrada">Fuoristrada</option>
                        <option value="epoca">Auto d'Epoca</option>
                        <option value="sportiva">Auto Sportiva</option>
                    </select>
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Foto Auto</label>
                    <input type="file" id="car-photo-input" accept="image/*" class="w-full px-4 py-2 bg-brand-dark border border-brand-border rounded-xl text-white text-xs focus:outline-none focus:border-brand-azzurro file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-brand-azzurro file:text-black">
                </div>
                <div class="sm:col-span-2">
                    <button type="submit" id="btn-save-car" class="btn-gradient text-white font-black w-full py-2.5 rounded-xl text-xs uppercase hover:opacity-90 transition">
                        <i class="fa-solid fa-floppy-disk"></i> Salva Dati Auto
                    </button>
                </div>
            </form>
        </div>

        <!-- EVENTI & RIUNIONI -->
        <div class="glass-panel p-6 rounded-3xl">
            <h3 class="text-lg font-black uppercase tracking-wide text-white mb-6 flex items-center gap-2">
                <i class="fa-solid fa-calendar-check text-brand-azzurro"></i> Eventi &amp; Riunioni
            </h3>
            <div id="member-events-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

        <!-- RADUNI -->
        <div class="glass-panel p-6 rounded-3xl space-y-5">
            <h3 class="text-lg font-black uppercase tracking-wide text-white flex items-center gap-2">
                <i class="fa-solid fa-images text-brand-azzurro"></i> Raduni
            </h3>
            <div id="member-raduni-list" class="space-y-5"></div>
        </div>

        <!-- Chat -->
        <div class="glass-panel p-6 rounded-3xl space-y-4">
            <div class="flex justify-between items-center border-b border-brand-border pb-3">
                <h3 class="text-lg font-black uppercase text-white flex items-center gap-2">
                    <i class="fa-solid fa-comments text-brand-azzurro"></i> Community &amp; Chat
                </h3>
                <select id="chat-type-select" class="bg-brand-dark border border-brand-border text-white text-xs rounded-xl p-2 font-bold focus:outline-none">
                    <option value="group">📢 Chat di Gruppo</option>
                    <option value="private">🔒 Messaggio Privato al Direttivo</option>
                </select>
            </div>

            <div id="chat-messages-container" class="h-64 overflow-y-auto space-y-3 p-2 bg-brand-dark/50 rounded-2xl border border-brand-border"></div>

            <form id="chat-form" class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Scrivi un messaggio..." required
                    class="flex-grow bg-brand-dark border border-brand-border rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-brand-azzurro">
                <button type="submit" class="btn-gradient text-white font-black px-5 py-2.5 rounded-xl text-xs uppercase hover:opacity-90 transition">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>

    </main>

    <script src="../js/config.js"></script>
    <script src="../js/chat.js"></script>
    <script src="../js/socio.js"></script>
</body>
</html>
