<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASCIA' CLUB | Accedi o Registrati</title>

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0A0A0C">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cascià Club">
    <link rel="apple-touch-icon" href="assets/img/logo-cascia.png">
    <link rel="icon" href="assets/img/logo-cascia.png">
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            azzurro: '#1EA7E1',
                            azzurroDark: '#0C7FB0',
                            dark: '#0A0A0C',
                            card: '#151519',
                            border: '#26262E'
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .glass-panel { background: rgba(21, 21, 25, 0.85); backdrop-filter: blur(16px); border: 1px solid #26262E; }
        .brand-gradient { background: linear-gradient(135deg, #1EA7E1 0%, #ffffff 100%); }
        .brand-text-gradient { background: linear-gradient(135deg, #1EA7E1 0%, #ffffff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-gradient { background: linear-gradient(135deg, #1EA7E1 0%, #0C7FB0 100%); }
    </style>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-brand-dark text-gray-100 font-sans min-h-screen flex flex-col justify-between antialiased">

    <!-- NAVBAR HEADER -->
    <nav class="sticky top-0 z-40 glass-panel border-b border-brand-border">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="assets/img/logo-cascia.png" alt="Logo Cascià Club" class="w-11 h-11 rounded-xl object-contain bg-white p-0.5">
                <span class="text-xl font-black uppercase text-white">CASCIA' <span class="brand-text-gradient">CLUB</span></span>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 flex flex-col items-center justify-center space-y-6">

        <!-- AUTH CARD FORM -->
        <div class="max-w-md w-full glass-panel p-6 sm:p-8 rounded-3xl shadow-2xl relative overflow-hidden">
            <div class="text-center mb-6">
                <h2 id="form-header-title" class="text-2xl font-black uppercase text-white">Accedi</h2>
                <p id="auth-subtitle" class="text-xs text-gray-400 mt-1">Inserisci le tue credenziali per accedere</p>
            </div>

            <div id="login-error-container"></div>

            <form id="auth-form" class="space-y-4">
                <div id="form-fields-container" class="space-y-4">
                    <!-- I campi vengono generati in modo sicuro da auth.js -->
                </div>

                <button type="submit" id="auth-submit-btn" class="w-full py-3.5 btn-gradient text-white font-black uppercase tracking-wider text-xs rounded-xl shadow-lg transition hover:opacity-90 active:scale-95">
                    Entra
                </button>
            </form>

            <div class="mt-6 text-center pt-4 border-t border-brand-border">
                <p id="auth-switch-text" class="text-xs text-gray-400">
                    Non hai un account?
                    <button type="button" id="btn-toggle-auth" class="text-brand-azzurro font-bold hover:underline ml-1">Registrati</button>
                </p>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="py-4 text-center text-xs text-gray-500 border-t border-brand-border">
        &copy; CASCIA' CLUB — Fuoristrada, Auto d'Epoca &amp; Auto Sportive. Since 1970.
    </footer>

    <!-- JS SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
